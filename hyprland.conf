#
# Hyprland — ThinkPad X1 Carbon Gen 7 (UHD 620 / 14" 1920x1080)
#
# 動く最小構成。ここから育てる前提で、視覚効果は控えめにしてある。
# blur を重ねると UHD 620 では GPU が回りっぱなしになりバッテリーに効く。
#
# 設定リファレンス: https://wiki.hypr.land/Configuring/
#

# ---------------------------------------------------------------- モニタ

# Gen 7 は 1920x1080 (低解像度モデル) または 2560x1440 / 3840x2160
# 実際の値は `hyprctl monitors` で確認して書き換える
monitor = eDP-1, 1920x1080@60, 0x0, 1

# 4K モデルの場合は scale を 2 にする
# monitor = eDP-1, 3840x2160@60, 0x0, 2

# 外部モニタは自動で右に並べる
monitor = , preferred, auto, 1

# ---------------------------------------------------------------- 自動起動

exec-once = hyprpolkitagent
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle
exec-once = fcitx5 -d
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ---------------------------------------------------------------- 環境変数

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = LIBVA_DRIVER_NAME,iHD

# ---------------------------------------------------------------- 入力

input {
    kb_layout = jp
    # US 配列なら us に。両方使うなら "us,jp" と kb_options で切り替え
    kb_options =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.5
    }
}

# トラックポイント。感度が合わなければ調整する
device {
    name = tpps/2-elan-trackpoint
    sensitivity = 0.2
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ---------------------------------------------------------------- 外観

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8

    # --- ここがバッテリーに効く箇所 ---
    # UHD 620 で blur を有効にすると常時 GPU が回る。
    # 見た目を優先したくなったら enabled = true にして、まず passes = 1 で試す。
    blur {
        enabled = false
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = false
    }

    active_opacity = 1.0
    inactive_opacity = 0.95
}

animations {
    enabled = true

    # 控えめなイージング。派手にしたければ end-4 や caelestia の
    # animations ブロックを読んで移植する
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    bezier = snappy, 0.2, 1.0, 0.3, 1.0

    animation = windows, 1, 4, snappy, popin 80%
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 4, snappy, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true          # 可変リフレッシュレート。省電力に効くので必ず有効
    vrr = 0
}

# ---------------------------------------------------------------- キーバインド

$mod = SUPER
$term = foot
$menu = wofi --show drun
$fileManager = thunar

# --- アプリ起動
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, firefox

# --- ウィンドウ操作
bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod SHIFT, Q, exit,

# --- フォーカス移動（vim 風 + 矢印）
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# --- ウィンドウ移動
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# --- リサイズ
binde = $mod CTRL, h, resizeactive, -40 0
binde = $mod CTRL, l, resizeactive, 40 0
binde = $mod CTRL, k, resizeactive, 0 -40
binde = $mod CTRL, j, resizeactive, 0 40

# --- ワークスペース
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- マウスドラッグ
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- スクリーンショット
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mod, Print, exec, grim -g "$(slurp)" ~/Pictures/$(date +%Y%m%d-%H%M%S).png

# --- クリップボード履歴
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# --- ロック
bind = $mod, L, exec, hyprlock

# --- ThinkPad のファンクションキー
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute, exec, pamixer -t
bindl  = , XF86AudioMicMute, exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# ---------------------------------------------------------------- ウィンドウルール

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, class:^(org.fcitx.)
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$

# fcitx5 の候補ウィンドウに影響しないよう、opacity を除外
windowrulev2 = opacity 1.0 override, class:^(firefox|foot)$

# ---------------------------------------------------------------- 電源関連

# ラップトップの蓋を閉じたら出力を無効化
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080@60, 0x0, 1"
