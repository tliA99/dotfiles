#
# hypridle — アイドル管理
#
# 注意: hypridle は設定ファイルが無いと起動しません。
#       hyprland.lua の autostart から起動しているので、このファイルは必須です。
#
# タイムアウトは AC/バッテリー共通です。TLP 側で CPU は絞っているので、
# ここでは画面まわりだけ面倒を見ます。
#

general {
    # ロック画面は 1 つだけ立ち上げる
    lock_cmd = pidof hyprlock || hyprlock

    # サスペンド前にロック。logind の PrepareForSleep 経由なので、
    # 蓋を閉じたとき / systemctl suspend / hypridle 自身のサスペンド全部に効きます。
    before_sleep_cmd = loginctl lock-session

    # 復帰時に画面を確実に戻す（キーを二度押す必要をなくす）
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # 2 = auto。hyprlock を検出してロック完了まで待ってくれます。
    inhibit_sleep = 2
}

# 2.5 分で画面を暗くする（復帰は即座に元の輝度へ）
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# キーボードバックライトも落とす。X1 Carbon Gen 7 は kbd_backlight を持っています。
listener {
    timeout    = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume  = brightnessctl -rd tpacpi::kbd_backlight
}

# 5 分でロック
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 分で画面 OFF
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 20 分でサスペンド。
# Gen 7 は BIOS で Sleep State = Linux にしてあれば S3 に落ちるので、
# ここが効いているかどうかでバッテリーの減り方がかなり変わります。
listener {
    timeout    = 1200
    on-timeout = systemctl suspend
}
