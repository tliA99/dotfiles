#
# hyprlock — ロック画面 (Tokyo Night Storm)
#
# 注意: hyprlock は設定ファイルが見つからないと「エラー終了」します。
#       設定が無い状態でロックのキーバインドを叩くと、画面がロックされないまま
#       何も起きないように見えます。このファイルはそのための必須ファイルです。
#

general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
    fail_timeout       = 2000
}

auth {
    pam:enabled = true
    pam:module  = hyprlock

    # 指紋センサ付きモデルで fprintd を設定済みなら true に
    fingerprint:enabled = false
}

animations {
    enabled = true
}
bezier   = linear, 1, 1, 0, 0
animation = fadeIn, 1, 2.0, linear
animation = fadeOut, 1, 2.0, linear

background {
    monitor =
    # デスクトップのスクリーンショットをぼかす。
    # UHD 620 でも一瞬なので blur_passes は 3 まで許容範囲です。
    path        = ~/Pictures/wallpapers/lock.jpg
    # blur_passes = 3
    # blur_size   = 8
    # noise       = 0.0117
    # contrast    = 0.9
    # brightness  = 0.4
    # vibrancy    = 0.17
}

# 時刻
label {
    monitor     = 
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgba(c0caf5ff)
    font_size   = 110
    font_family = JetBrainsMono Nerd Font ExtraBold

    position = 0, 220
    halign   = center
    valign   = center

    shadow_passes = 2
    shadow_size   = 5
    shadow_color  = rgba(0d0e14aa)
}

# 日付
label {
    monitor     =
    text        = cmd[update:60000] date +"%Y年%-m月%-d日 (%a)"
    color       = rgba(7aa2f7ff)
    font_size   = 20
    font_family = Noto Sans CJK JP

    position = 0, 140
    halign   = center
    valign   = center
}

# ユーザー名
label {
    monitor     =
    text        = $USER
    color       = rgba(c0caf5cc)
    font_size   = 16
    font_family = Noto Sans CJK JP

    position = 0, 58
    halign   = center
    valign   = center
}

input-field {
    monitor =
    size    = 320, 52
    rounding = 14

    outline_thickness = 2
    outer_color = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    inner_color = rgba(24283bdd)
    font_color  = rgba(c0caf5ff)
    font_family = JetBrainsMono Nerd Font

    check_color = rgba(e0af68ee) rgba(9ece6aee) 45deg
    fail_color  = rgba(f7768eee) rgba(bb9af7ee) 45deg
    fail_text   = <i>$FAIL <b>($ATTEMPTS)</b></i>

    capslock_color   = rgba(e0af68ee)
    placeholder_text = <i><span foreground="##565f89">パスワード</span></i>

    fade_on_empty = false
    dots_size     = 0.22
    dots_spacing  = 0.35
    dots_center   = true

    position = 0, -20
    halign   = center
    valign   = center

    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0d0e1499)
}

# キーボードレイアウト（jp / us を切り替えて使う人向け）
label {
    monitor     =
    text        = $LAYOUT[jp,us]
    color       = rgba(565f89ff)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, -80
    halign   = center
    valign   = center
}

# バッテリー
label {
    monitor     =
    text        = cmd[update:30000] printf "󰁹 %s%%" "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '--')"
    color       = rgba(9ece6aff)
    font_size   = 14
    font_family = JetBrainsMono Nerd Font

    position = -30, 20
    halign   = right
    valign   = bottom
}
