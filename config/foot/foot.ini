# foot — Tokyo Night Storm
#
# 日本語が豆腐になる場合は noto-fonts-cjk が入っているか確認してください。
# fallback に指定してあるので、JetBrainsMono に無い字は Noto から拾います。

font=JetBrainsMono Nerd Font:size=10.5, Noto Sans Mono CJK JP:size=10.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=10.5, Noto Sans Mono CJK JP:style=Bold:size=10.5
line-height=17
pad=14x12
dpi-aware=no

[main]
term=foot
# ログインシェルをそのまま使います。zsh を既定にしたいなら
#   chsh -s /usr/bin/zsh
# としてください（ここに書くと、そのシェルが無いとき foot ごと起動しません）。
selection-target=clipboard

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
beam-thickness=1.5
blink=yes

[mouse]
hide-when-typing=yes

# foot 1.26 で [colors] は廃止され、[colors-dark] / [colors-light] に
# 分割されました（[colors2] は [colors-light] に相当）。
# 既定で使われるのは colors-dark で、main の initial-color-theme=light
# を指定するか color-theme-toggle のキーバインドで light に切り替わります。

[colors-dark]
# Tokyo Night Storm
background=1a1b26
foreground=c0caf5

selection-background=283457
selection-foreground=c0caf5

urls=7dcfff

# normal
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

# bright
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[colors-light]
# Tokyo Night Day（ライトに切り替えたときも破綻しないように定義しておく）
background=e1e2e7
foreground=3760bf

selection-background=99a7df
selection-foreground=3760bf

urls=2e7de9

regular0=b4b5b9
regular1=f52a65
regular2=587539
regular3=8c6c3e
regular4=2e7de9
regular5=9854f1
regular6=007197
regular7=6172b0

bright0=a1a6c5
bright1=f52a65
bright2=587539
bright3=8c6c3e
bright4=2e7de9
bright5=9854f1
bright6=007197
bright7=3760bf

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
# ライト/ダーク切り替え
color-theme-toggle=Control+Shift+t
